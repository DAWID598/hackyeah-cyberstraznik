services:
  postgres:
    image: postgres:16-alpine
    container_name: cyber-straznik-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cyberstraznik
      POSTGRES_PASSWORD: cyberstraznik
      POSTGRES_DB: cyberstraznik
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberstraznik -d cyberstraznik"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
